[workspace]
members = [
  "crates/streetman-core",
  "crates/streetman-cli",
]
resolver = "2"

[workspace.package]
version = "6.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/efij/streetman"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
hex = "0.4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tiktoken-rs = "0.12"
toml = "0.8"
zeroize = "1"

# Max-optimization release build: smallest, fastest single binary.
# panic stays "unwind" (the default) so `cargo test --release` keeps unwinding-
# based failure reporting on stable — panic="abort" would break that.
[profile.release]
opt-level = 3        # full speed optimization
lto = "fat"          # whole-program link-time optimization (size + speed)
codegen-units = 1    # one unit = best cross-function optimization
strip = "symbols"    # drop debug/symbol tables from the shipped binary
panic = "abort"      # no unwinding tables: smaller + faster (no catch_unwind in tree)
debug = false
incremental = false
overflow-checks = false
