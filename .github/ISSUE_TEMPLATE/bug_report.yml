name: 🐛 Bug Report
description: Something is broken or not working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Accuracy regressions should use the **Accuracy Regression** template instead.

  - type: input
    id: version
    attributes:
      label: streetman version
      placeholder: "0.1.0 / main @ abc1234"
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Cursor
        - Codex CLI
        - VS Code
        - Standalone CLI
        - MCP server
        - LiteLLM adapter
        - Portkey adapter
        - OpenRouter adapter
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15.4 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `streetman compress foo.md`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
