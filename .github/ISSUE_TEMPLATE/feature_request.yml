name: ✨ Feature Request
description: Propose a new feature or improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: bench
    attributes:
      label: Expected bench impact
      description: What % savings change? Accuracy impact?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Category
      options:
        - label: New shortcut / lexicon entry
        - label: New domain profile
        - label: New host adapter
        - label: New gateway adapter
        - label: Accuracy rubric improvement
        - label: Performance optimization
        - label: Other
